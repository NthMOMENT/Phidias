name: Build Escrow Program

on:
  push:
    branches: [ escrow-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.26/install)"
          ls $HOME/.local/share/solana/install/active_release/bin/

      - name: Build
        run: |
          $HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf 2>&1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phidias-escrow-so
          path: target/deploy/phidias_escrow.so
