name: Build Escrow Program

on:
  push:
    branches: [ escrow-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana
        run: |
          curl -L https://github.com/solana-labs/solana/releases/download/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o solana-release.tar.bz2
          tar -xjf solana-release.tar.bz2
          echo "$GITHUB_WORKSPACE/solana-release/bin" >> $GITHUB_PATH

      - name: Download platform-tools and build
        run: |
          rm -f Cargo.lock
          cargo-build-sbf --force-tools-install 2>&1 || true
          PT_CARGO=$(find $HOME/.cache/solana -name "cargo" -not -name "*.bak" -type f 2>/dev/null | head -1)
          echo "Platform-tools cargo: $PT_CARGO"
          $PT_CARGO --version
          rm -f Cargo.lock
          $PT_CARGO generate-lockfile
          head -3 Cargo.lock
          cargo-build-sbf 2>&1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phidias-escrow-so
          path: target/deploy/phidias_escrow.so
